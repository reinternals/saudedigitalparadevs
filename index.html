<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DefaultDocs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" id="hljs-theme"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>

  <header id="header">
    <div class="header-brand">
      <button id="menu-toggle" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <a href="#/" id="site-name">DefaultDocs</a>
    </div>
    <div class="header-right">
      <nav id="header-links" aria-label="Site links"></nav>
      <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-search">
        <input type="search" id="search-input" placeholder="Pesquisar…" autocomplete="off" spellcheck="false">
      </div>
      <nav id="nav-tree"></nav>
    </aside>
    <div class="overlay" id="overlay"></div>

    <div id="main">
      <div class="main-inner">
        <div class="content-wrapper">
          <article id="article">
            <div class="state-loading">Loading…</div>
          </article>
        </div>
        <aside id="toc-sidebar" aria-label="Table of contents">
          <div id="toc"></div>
        </aside>
      </div>
      <div id="page-footer"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
